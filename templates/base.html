{% load bootstrap5 %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoEnergy - Monitoreo{% endblock %}</title>
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body class="bg-light">
    <!-- Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'lista_zonas' %}">ECOENERGY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navEco" aria-controls="navEco" aria-expanded="false" aria-label="Navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navEco">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_zonas' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_zonas' %}">Zonas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Inyectado -->
    <main class="container mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white py-3 border-top text-center text-muted fixed-bottom">
        <small>EcoEnergy &copy; 2026 - Sistema de Monitoreo Energético</small>
    </footer>
</body>
</html>
